<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamleys Toys</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <div class="logo">
        <img src="https://cdn.fynd.com/v2/falling-surf-7c8bb8/fyprod/wrkr/company/46/applications/605884f889251331fe847d80/application/pictures/free-logo/original/04rZ3hlC2-HAMLEYS_IN.png" alt="Hamleys">
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Brands</a>
        <a href="#">New Arrivals</a>
        <a href="#">Offers</a>
        <a href="#">Contact</a>
    </nav>

</header>

<section class="banner">
    <img src="images/banner.jpg" alt="">
</section>

<section class="categories">

    <h2>Shop By Category</h2>

    <div class="category-box">

        <div class="card">
            <img src="images/teddy.jpg">
            <h3>Soft Toys</h3>
        </div>

        <div class="card">
            <img src="images/car.jpg">
            <h3>Remote Cars</h3>
        </div>

        <div class="card">
            <img src="images/doll.jpg">
            <h3>Dolls</h3>
        </div>

        <div class="card">
            <img src="images/puzzle.jpg">
            <h3>Puzzles</h3>
        </div>

    </div>

</section>

<section class="featured">

<h2>Featured Products</h2>

<div class="product-container">

<div class="product">
<img src="images/lego.jpg">
<h3>LEGO Set</h3>
<p>$49.99</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="images/bike.jpg">
<h3>Kids Bike</h3>
<p>$89.99</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="images/teddy.jpg">
<h3>Teddy Bear</h3>
<p>$19.99</p>
<button>Buy Now</button>
</div>

<div class="product">
<img src="images/car.jpg">
<h3>Racing Car</h3>
<p>$24.99</p>
<button>Buy Now</button>
</div>

</div>

</section>

<footer>

<p>© 2026 Hamleys Inspired Design</p>

</footer>

</body>
</html>
