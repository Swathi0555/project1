<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        
    <style>
        div{width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            display: flex;
            margin: 200px auto;
        }
        img{
            height: 300px;
            width: 300px;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            filter: drop-shadow(0px 10px 20px red);
             animation-name: love;
           

        }
        @keyframes love{
            0%{
                transform:scale(1);

            }
            50%{
                 transform:scale(1.2);

            }
            100%{
                transform:scale(1);
            }
        }
    </style>
</head>
<body>
     <div>
        <img src="https://png.pngtree.com/png-clipart/20241112/original/pngtree-human-heart-transparent-background-png-image_16963998.png" alt="">
    </div>
</body>
</html>
